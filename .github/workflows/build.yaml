name: Build Dobby

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  NDK_VERSION: r25b

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            setup: sh scripts/setup_linux_cross_compile.sh
            platform_args: ""
          - platform: android
            runner: ubuntu-latest
            setup: sh scripts/setup_linux_cross_compile.sh
            platform_args: --android_ndk_dir=$HOME/opt/ndk-$NDK_VERSION
          - platform: macos
            runner: macos-latest
            setup: sh scripts/setup_macos_cross_compile.sh
            platform_args: ""
          - platform: iphoneos
            runner: macos-latest
            setup: sh scripts/setup_macos_cross_compile.sh
            platform_args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@master
      - run: ${{ matrix.setup }}
      - name: Compile
        run: |
          python3 scripts/platform_builder.py --platform=${{ matrix.platform }} --arch=all ${{ matrix.platform_args }}
          cp include/dobby.h build/${{ matrix.platform }}
          tar -zcvf build/dobby-${{ matrix.platform }}-all.tar.gz build/${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: build/dobby-${{ matrix.platform }}-all.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -name '*.tar.gz' -exec cp {} release-assets/ \;
      - name: Delete old latest release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
      - name: Create new latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest \
            --title "Latest Build (${{ github.sha }})" \
            --notes "Automated build from commit ${{ github.sha }}" \
            --target ${{ github.sha }} \
            release-assets/*.tar.gz
